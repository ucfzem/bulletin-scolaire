<!DOCTYPE html><html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulletin Scolaire Pro - GIMI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --navy: #1a2a3a;
      --gold: #c5a059;
      --light-bg: #f4f6f9;
      --border: #e2e8f0;
      --text: #334155;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', 'Tajawal', sans-serif;
    }


    body {
      background-color: var(--light-bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }


    .toolbar {
      width: 100%;
      max-width: 850px;
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }


    button {
      background-color: var(--navy);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.2s;
    }


    button:hover { opacity: 0.9; }
    button.secondary { background-color: var(--gold); }
    button.danger { background-color: #e11d48; }


    .report-card {
      background: white;
      width: 100%;
      max-width: 850px;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      border-top: 6px solid var(--navy);
    }


    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 25px;
    }


    .logo-container {
      width: 90px;
      height: 90px;
      border: 2px dashed var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      background-color: #f8fafc;
      color: #94a3b8;
    }


    .logo-container svg { width: 32px; height: 32px; fill: currentColor; }
    .logo-container img { width: 100%; height: 100%; object-fit: contain; }


    .school-info { text-align: right; }
    html[dir="rtl"] .school-info { text-align: left; }


    .school-info input, .school-info select {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--navy);
      border: none;
      border-bottom: 1px dashed rgba(197,160,89,0.6);
      background: transparent;
      cursor: text;
    }
    .school-info input:hover, .school-info select:hover { border-bottom-color: var(--gold); }
    .school-info input:focus, .school-info select:focus { border-bottom-color: var(--gold); outline: none; }


    .meta-row {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      align-items: center;
      margin-top: 5px;
    }
    html[dir="rtl"] .meta-row { justify-content: flex-start; }
    .meta-row input, .meta-row select { font-size: 0.85rem !important; color: #64748b !important; font-weight: 500 !important; }


    .student-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
      background-color: #f8fafc;
      padding: 15px;
      border-radius: 6px;
    }


    .field { display: flex; flex-direction: column; }
    .field label { font-size: 0.8rem; text-transform: uppercase; color: #64748b; margin-bottom: 4px; font-weight: 600; }
    .field input { padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; }


    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { border: 1px solid var(--border); padding: 10px; text-align: center; }
    th { background-color: var(--navy); color: white; font-weight: 600; }
    td input { width: 100%; text-align: center; border: 1px solid transparent; padding: 4px; }
    td input:focus { border-color: var(--gold); outline: none; }
    .subject-name { text-align: start; font-weight: 500; }


    .summary-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--navy);
      color: white;
      padding: 15px 20px;
      border-radius: 6px;
      margin-top: 20px;
    }


    .summary-item { display: flex; flex-direction: column; }
    .summary-item span:first-child { font-size: 0.8rem; opacity: 0.8; }
    .summary-item span:last-child { font-size: 1.3rem; font-weight: 700; color: var(--gold); }


    .auto-appreciation {
      margin-top: 15px;
      padding: 10px 15px;
      background-color: #f1f5f9;
      border-left: 4px solid var(--gold);
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--navy);
    }
    html[dir="rtl"] .auto-appreciation { border-left: none; border-right: 4px solid var(--gold); }


    .obs-section { margin-top: 20px; display: flex; flex-direction: column; }
    .obs-section label { font-size: 0.85rem; font-weight: 600; color: var(--navy); margin-bottom: 5px; }
    .obs-section textarea { width: 100%; height: 70px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; resize: vertical; font-size: 0.9rem; }


    .signatures-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 35px;
      text-align: center;
    }


    .signature-box {
      border: 1px dashed var(--border);
      padding: 15px;
      border-radius: 6px;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .signature-box span { font-size: 0.85rem; font-weight: 600; color: var(--navy); }


    .footer-signature {
      margin-top: 30px;
      text-align: center;
      font-size: 0.8rem;
      color: #94a3b8;
      border-top: 1px solid var(--border);
      padding-top: 15px;
    }


    @media print {
      body { background: white; padding: 0; }
      .toolbar, .btn-action, th:last-child, td:last-child { display: none !important; }
      .report-card { box-shadow: none; border-top: none; padding: 0; width: 100%; }
      input, select, textarea { border: none !important; background: transparent !important; appearance: none; }
      .signature-box { border: 1px solid #cbd5e1; }
    }
  </style>
</head>
<body>


  <div class="toolbar">
    <button onclick="toggleLang()" class="secondary" id="lang-btn">العربية</button>
    <button onclick="addSubject()" class="btn-action" id="add-btn">+ Ajouter Matière</button>
    <button onclick="fillDemo()" class="btn-action" id="demo-btn">Remplir Démo</button>
    <button onclick="resetForm()" class="danger btn-action" id="reset-btn">Réinitialiser</button>
    <button onclick="window.print()" class="btn-action" id="print-btn">Imprimer / PDF</button>
  </div>


  <div class="report-card">
    <div class="header">
      <div class="logo-container" onclick="document.getElementById('logo-input').click()">
        <div id="logo-placeholder" style="text-align:center;">
          <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6l9-4.91V17h2V9L12 3z M5 13.18v4L12 21l7-3.82v-4L12 17L5 13.18z"/></svg>
          <div style="font-size:0.65rem; margin-top:4px;">+ Logo</div>
        </div>
        <img id="logo-img" style="display:none;" />
        <input type="file" id="logo-input" accept="image/*" style="display:none" onchange="loadLogo(event)">
      </div>


      <div class="school-info">
        <input type="text" id="school-name" value="École Excellence" oninput="saveData()">
        <div class="meta-row">
          <select id="period-select" onchange="saveData()">
            <option value="p1">Premier Semestre</option>
            <option value="p2">Deuxième Semestre</option>
            <option value="p3">Troisième Semestre</option>
          </select>
          <span>|</span>
          <input type="text" id="school-year" value="2025-2026" style="width: 90px;" oninput="saveData()">
        </div>
      </div>
    </div>


    <div class="student-info">
      <div class="field">
        <label id="lbl-name">Nom & Prénom</label>
        <input type="text" id="student-name" placeholder="Ex: Yassine Mansouri" oninput="saveData()">
      </div>
      <div class="field">
        <label id="lbl-class">Classe</label>
        <input type="text" id="student-class" placeholder="Ex: 3ème Année" oninput="saveData()">
      </div>
      <div class="field">
        <label id="lbl-id">Matricule</label>
        <input type="text" id="student-id" placeholder="Ex: 2026-88" oninput="saveData()">
      </div>
    </div>


    <table>
      <thead>
        <tr>
          <th id="th-subject">Matière</th>
          <th id="th-note" style="width: 120px;">Note (/20)</th>
          <th id="th-coef" style="width: 100px;">Coef</th>
          <th id="th-total" style="width: 120px;">Total</th>
          <th class="btn-action" style="width: 50px;">Action</th>
        </tr>
      </thead>
      <tbody id="subjects-body"></tbody>
    </table>


    <div class="summary-box">
      <div class="summary-item">
        <span id="lbl-total-coef">Total Coefficients</span>
        <span id="res-coef">0</span>
      </div>
      <div class="summary-item">
        <span id="lbl-average">Moyenne Générale</span>
        <span id="res-average">-- / 20</span>
      </div>
      <div class="summary-item">
        <span id="lbl-mention">Mention</span>
        <span id="res-mention">--</span>
      </div>
    </div>


    <div class="auto-appreciation" id="auto-appreciation-box">
      <span id="lbl-apprec-title">Appréciation globale :</span> <span id="res-appreciation">--</span>
    </div>


    <div class="obs-section">
      <label id="lbl-obs">Observations du professeur principal</label>
      <textarea id="obs-text" placeholder="Remarques et conseils..." oninput="saveData()"></textarea>
    </div>


    <div class="signatures-grid">
      <div class="signature-box"><span id="lbl-sig-parents">Signature des parents</span></div>
      <div class="signature-box"><span id="lbl-sig-director">Cachet & Signature du Directeur</span></div>
    </div>


    <div class="footer-signature">Outil développé par GIMI - Tanger</div>
  </div>


  <script>
    let currentLang = 'fr';


    const translations = {
      fr: {
        langBtn: "العربية", addBtn: "+ Ajouter Matière", demoBtn: "Remplir Démo",
        resetBtn: "Réinitialiser", printBtn: "Imprimer / PDF",
        lblName: "Nom & Prénom", lblClass: "Classe", lblId: "Matricule",
        thSubject: "Matière", thNote: "Note (/20)", thCoef: "Coef", thTotal: "Total",
        lblTotalCoef: "Total Coefficients", lblAverage: "Moyenne Générale", lblMention: "Mention",
        lblApprecTitle: "Appréciation globale :", lblObs: "Observations du professeur principal",
        lblSigParents: "Signature des parents", lblSigDirector: "Cachet & Signature du Directeur",
        periods: { p1: "Premier Semestre", p2: "Deuxième Semestre", p3: "Troisième Semestre" }
      },
      ar: {
        langBtn: "Français", addBtn: "+ إضافة مادة", demoBtn: "ملء تجريبي",
        resetBtn: "إعادة ضبط", printBtn: "طباعة / PDF",
        lblName: "الاسم والنسب", lblClass: "المستوى", lblId: "رقم التسجيل",
        thSubject: "المادة", thNote: "النقطة (20/)", thCoef: "المعامل", thTotal: "المجموع",
        lblTotalCoef: "مجموع المعاملات", lblAverage: "المعدل العام", lblMention: "الميزة",
        lblApprecTitle: "التقدير العام :", lblObs: "ملاحظات الأستاذ الرئيسي",
        lblSigParents: "توقيع ولي الأمر", lblSigDirector: "خاتم وتوقيع المدير",
        periods: { p1: "الدورة الأولى", p2: "الدورة الثانية", p3: "الدورة الثالثة" }
      }
    };


    function getDefaultSubjects() {
      return [
        { name_fr: "Mathématiques", name_ar: "الرياضيات", note: "", coef: 3 },
        { name_fr: "Physique", name_ar: "الفيزياء", note: "", coef: 2 },
        { name_fr: "SVT", name_ar: "علوم الحياة والأرض", note: "", coef: 2 },
        { name_fr: "Français", name_ar: "الفرنسية", note: "", coef: 3 },
        { name_fr: "Arabe", name_ar: "العربية", note: "", coef: 3 },
        { name_fr: "Anglais", name_ar: "الإنجليزية", note: "", coef: 2 }
      ];
    }


    let subjectsData = getDefaultSubjects();


    function init() {
      const saved = localStorage.getItem('bulletin_data');
      if (saved) {
        const parsed = JSON.parse(saved);
        subjectsData = parsed.subjects || subjectsData;
        document.getElementById('student-name').value = parsed.name || '';
        document.getElementById('student-class').value = parsed.class || '';
        document.getElementById('student-id').value = parsed.id || '';
        document.getElementById('school-name').value = parsed.schoolName || 'École Excellence';
        document.getElementById('school-year').value = parsed.schoolYear || '2025-2026';
        document.getElementById('period-select').value = parsed.period || 'p1';
        document.getElementById('obs-text').value = parsed.obs || '';
      }
      render();
    }


    function render() {
      const t = translations[currentLang];
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      
      document.getElementById('lang-btn').innerText = t.langBtn;
      document.getElementById('add-btn').innerText = t.addBtn;
      document.getElementById('demo-btn').innerText = t.demoBtn;
      document.getElementById('reset-btn').innerText = t.resetBtn;
      document.getElementById('print-btn').innerText = t.printBtn;
      document.getElementById('lbl-name').innerText = t.lblName;
      document.getElementById('lbl-class').innerText = t.lblClass;
      document.getElementById('lbl-id').innerText = t.lblId;
      document.getElementById('th-subject').innerText = t.thSubject;
      document.getElementById('th-note').innerText = t.thNote;
      document.getElementById('th-coef').innerText = t.thCoef;
      document.getElementById('th-total').innerText = t.thTotal;
      document.getElementById('lbl-total-coef').innerText = t.lblTotalCoef;
      document.getElementById('lbl-average').innerText = t.lblAverage;
      document.getElementById('lbl-mention').innerText = t.lblMention;
      document.getElementById('lbl-apprec-title').innerText = t.lblApprecTitle;
      document.getElementById('lbl-obs').innerText = t.lblObs;
      document.getElementById('lbl-sig-parents').innerText = t.lblSigParents;
      document.getElementById('lbl-sig-director').innerText = t.lblSigDirector;


      const select = document.getElementById('period-select');
      const selectedVal = select.value;
      select.innerHTML = `
        <option value="p1">${t.periods.p1}</option>
        <option value="p2">${t.periods.p2}</option>
        <option value="p3">${t.periods.p3}</option>
      `;
      select.value = selectedVal;


      const tbody = document.getElementById('subjects-body');
      tbody.innerHTML = '';


      subjectsData.forEach((item, idx) => {
        const name = currentLang === 'ar' ? (item.name_ar || item.name_fr) : (item.name_fr || item.name_ar);
        const total = (item.note !== "" && !isNaN(item.note)) ? (parseFloat(item.note) * parseFloat(item.coef)).toFixed(2) : "-";


        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="text" class="subject-name" value="${name}" oninput="updateSubjectName(${idx}, this.value)"></td>
          <td><input type="number" min="0" max="20" step="0.25" value="${item.note}" oninput="updateNote(${idx}, this.value)"></td>
          <td><input type="number" min="1" value="${item.coef}" oninput="updateCoef(${idx}, this.value)"></td>
          <td>${total}</td>
          <td class="btn-action"><button class="danger" style="padding:2px 8px;" onclick="removeSubject(${idx})">×</button></td>
        `;
        tbody.appendChild(tr);
      });


      calculate();
    }


    function updateSubjectName(idx, val) {
      if (currentLang === 'ar') subjectsData[idx].name_ar = val;
      else subjectsData[idx].name_fr = val;
      saveData();
    }


    function updateNote(idx, val) { subjectsData[idx].note = val; renderCalculationsOnly(); saveData(); }
    function updateCoef(idx, val) { subjectsData[idx].coef = val; renderCalculationsOnly(); saveData(); }


    function addSubject() {
      subjectsData.push({ name_fr: "Nouvelle Matière", name_ar: "مادة جديدة", note: "", coef: 1 });
      render(); saveData();
    }


    function removeSubject(idx) { subjectsData.splice(idx, 1); render(); saveData(); }


    function calculate() {
      let totalPoints = 0, totalCoef = 0, valid = false;
      subjectsData.forEach(item => {
        const n = parseFloat(item.note), c = parseFloat(item.coef);
        if (!isNaN(n) && !isNaN(c) && item.note !== "") { totalPoints += n * c; totalCoef += c; valid = true; }
      });


      document.getElementById('res-coef').innerText = totalCoef;


      if (valid && totalCoef > 0) {
        const avg = (totalPoints / totalCoef).toFixed(2);
        document.getElementById('res-average').innerText = `${avg} / 20`;
        document.getElementById('res-mention').innerText = getMention(avg);
        document.getElementById('res-appreciation').innerText = getAppreciation(avg);
      } else {
        document.getElementById('res-average').innerText = "-- / 20";
        document.getElementById('res-mention').innerText = "--";
        document.getElementById('res-appreciation').innerText = "--";
      }
    }


    function renderCalculationsOnly() {
      const rows = document.querySelectorAll('#subjects-body tr');
      subjectsData.forEach((item, idx) => {
        const totalCell = rows[idx].children[3];
        const total = (item.note !== "" && !isNaN(item.note)) ? (parseFloat(item.note) * parseFloat(item.coef)).toFixed(2) : "-";
        totalCell.innerText = total;
      });
      calculate();
    }


    function getMention(avg) {
      if (avg >= 16) return currentLang === 'ar' ? 'ممتاز' : 'Très Bien';
      if (avg >= 14) return currentLang === 'ar' ? 'جيد جداً' : 'Bien';
      if (avg >= 12) return currentLang === 'ar' ? 'جيد' : 'Assez Bien';
      if (avg >= 10) return currentLang === 'ar' ? 'مقبول' : 'Passable';
      return currentLang === 'ar' ? 'دون المتوسط' : 'Insuffisant';
    }


    function getAppreciation(avg) {
      if (avg >= 16) return currentLang === 'ar' ? 'عمل ممتاز، تهانينا!' : 'Excellents résultats, félicitations !';
      if (avg >= 14) return currentLang === 'ar' ? 'عمل جيد جداً، واصل الإجتهاد.' : 'Très bon travail, continuez ainsi.';
      if (avg >= 12) return currentLang === 'ar' ? 'عمل جيد، يمكنك تحقيق الأفضل.' : 'Bon travail dans ensemble, peut mieux faire.';
      if (avg >= 10) return currentLang === 'ar' ? 'نتائج مقبولة، يجب بذل المزيد من الجهد.' : 'Résultats passables, des efforts sont requis.';
      return currentLang === 'ar' ? 'نتائج غير كافية، يجب العمل بجدية أكبر.' : 'Résultats insuffisants, un redressement s\'impose.';
    }


    function toggleLang() { currentLang = currentLang === 'fr' ? 'ar' : 'fr'; render(); }


    function fillDemo() {
      document.getElementById('student-name').value = "Yassine Mansouri";
      document.getElementById('student-class').value = "3ème Année Collège";
      document.getElementById('student-id').value = "2026-442";
      document.getElementById('obs-text').value = currentLang === 'ar' ? 'تلميذ مجد ومواظب، يتمنى له الطاقم التربوي المزيد من التوفيق.' : 'Élève très sérieux et assidu. Bon comportement général.';


      subjectsData = [
        { name_fr: "Mathématiques", name_ar: "الرياضيات", note: "16.5", coef: 3 },
        { name_fr: "Physique", name_ar: "الفيزياء", note: "14.0", coef: 2 },
        { name_fr: "SVT", name_ar: "علوم الحياة والأرض", note: "15.0", coef: 2 },
        { name_fr: "Français", name_ar: "الفرنسية", note: "13.5", coef: 3 },
        { name_fr: "Arabe", name_ar: "العربية", note: "17.0", coef: 3 },
        { name_fr: "Anglais", name_ar: "الإنجليزية", note: "15.5", coef: 2 }
      ];
      render(); saveData();
    }


    function resetForm() {
      document.getElementById('student-name').value = "";
      document.getElementById('student-class').value = "";
      document.getElementById('student-id').value = "";
      document.getElementById('obs-text').value = "";
      subjectsData = getDefaultSubjects();
      localStorage.removeItem('bulletin_data');
      render();
    }


    function loadLogo(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          document.getElementById('logo-img').src = evt.target.result;
          document.getElementById('logo-img').style.display = 'block';
          document.getElementById('logo-placeholder').style.display = 'none';
        }
        reader.readAsDataURL(file);
      }
    }


    function saveData() {
      const data = {
        name: document.getElementById('student-name').value,
        class: document.getElementById('student-class').value,
        id: document.getElementById('student-id').value,
        schoolName: document.getElementById('school-name').value,
        schoolYear: document.getElementById('school-year').value,
        period: document.getElementById('period-select').value,
        obs: document.getElementById('obs-text').value,
        subjects: subjectsData
      };
      localStorage.setItem('bulletin_data', JSON.stringify(data));
    }


    init();
  </script>
</body>
</html>
