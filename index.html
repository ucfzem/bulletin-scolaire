<!DOCTYPE html><html lang="fr" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulletin Scolaire Pro - UcfZem</title>
  
  <!-- Polices -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    /* ========== LIGHT MODE (par défaut) ========== */
    :root,
    [data-theme="light"] {
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --navy: #1a2a3a;
      --navy-light: #1e3448;
      --gold: #c5a059;
      --gold-light: #d4b36e;
      --border: #e2e8f0;
      --text: #334155;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --input-bg: #ffffff;
      --table-stripe: #f8fafc;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.06);
      --danger: #e11d48;
      --danger-hover: #be123c;
      --logo-bg: #f8fafc;
      --logo-border: #cbd5e1;
    }


    /* ========== DARK MODE ========== */
    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --navy: #334155;
      --navy-light: #475569;
      --gold: #d4b36e;
      --gold-light: #e2c78c;
      --border: #334155;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --text-light: #64748b;
      --input-bg: #1e293b;
      --table-stripe: #1a2332;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.3), 0 2px 4px -2px rgba(0,0,0,0.2);
      --danger: #f87171;
      --danger-hover: #ef4444;
      --logo-bg: #1e293b;
      --logo-border: #475569;
    }


    /* ========== RESET ========== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', 'Tajawal', sans-serif;
    }


    html {
      font-size: 16px;
    }


    /* Grands écrans */
    @media (min-width: 1400px) { html { font-size: 18px; } }
    @media (min-width: 2000px) { html { font-size: 20px; } }
    @media (min-width: 3000px) { html { font-size: 24px; } }


    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }


    /* ========== TOOLBAR ========== */
    .toolbar {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }


    .actions-main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.5rem;
      flex: 1;
      min-width: 0;
    }


    .actions-utility {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }


    button {
      background-color: var(--navy);
      color: #ffffff;
      border: 2px solid transparent;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      white-space: nowrap;
      outline: none;
      box-sizing: border-box;
    }


    button:focus-visible {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.3);
    }


    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:active { transform: translateY(0); }


    button.secondary { background-color: var(--gold); color: #1a2a3a; }
    button.danger { background-color: var(--danger); }
    button.danger:hover { background-color: var(--danger-hover); }


    .theme-toggle {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.2rem;
      padding: 0.4rem 0.6rem;
      border-radius: 50%;
      width: 2.5rem;
      height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }


    .theme-toggle:hover { background-color: var(--border); }


    /* ========== REPORT CARD ========== */
    .report-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 900px;
      padding: 2.5rem;
      border-radius: 0.75rem;
      box-shadow: var(--shadow);
      border-top: 6px solid var(--navy);
      transition: background-color 0.3s ease;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }


    @media (min-width: 1400px) { .report-card { max-width: 1100px; padding: 3rem; } }
    @media (min-width: 2000px) { .report-card { max-width: 1400px; padding: 4rem; } }


    /* ========== HEADER (centré) ========== */
    .header-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      border-bottom: 2px solid var(--border);
      padding-bottom: 1.25rem;
      margin-bottom: 1.5rem;
    }


    .school-title {
      width: 100%;
      max-width: 100%;
      margin: 1rem 0 0.5rem 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--navy);
      text-align: center;
      border: none;
      border-bottom: 1px dashed var(--gold);
      background: transparent;
      padding: 0.2rem 0.5rem;
      cursor: text;
      box-sizing: border-box;
    }
    .school-title:focus { outline: none; border-bottom-color: var(--gold); }
    html[dir="rtl"] .school-title { direction: rtl; }


    .meta-info {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 0.25rem;
    }
    html[dir="rtl"] .meta-info { flex-direction: row-reverse; }


    .meta-info select,
    .meta-info input {
      font-size: 0.85rem !important;
      color: var(--text-muted) !important;
      font-weight: 500 !important;
      border: none;
      border-bottom: 1px dashed var(--gold);
      background: transparent;
      padding: 0.2rem 0;
      cursor: text;
    }
    .meta-info select:focus, .meta-info input:focus { outline: none; }


    .divider { color: var(--text-light); font-weight: 300; }


    .logo-container {
      width: 100px;
      height: 100px;
      min-width: 100px;
      border: 2px dashed var(--logo-border);
      border-radius: 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      background-color: var(--logo-bg);
      color: var(--text-light);
      transition: all 0.2s ease;
      position: relative;
    }


    .logo-container:hover, .logo-container:focus-visible {
      border-color: var(--gold);
      background-color: var(--card-bg);
      outline: none;
    }


    .logo-container svg {
      width: 36px;
      height: 36px;
      fill: currentColor;
      flex-shrink: 0;
    }


    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: absolute;
      top: 0;
      left: 0;
    }


    .logo-text {
      font-size: 0.65rem;
      margin-top: 4px;
      text-align: center;
    }


    #logo-input { display: none; }


    /* ========== STUDENT INFO ========== */
    .student-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
      background-color: var(--table-stripe);
      padding: 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
    }


    .field {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }


    .field label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }


    .field input {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      font-size: 0.9rem;
      background-color: var(--input-bg);
      color: var(--text);
      max-width: 100%;
    }


    .field input:focus {
      border-color: var(--gold);
      outline: none;
      box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
    }


    /* ========== TABLE ========== */
    .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 1.25rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
    }


    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 480px;
      table-layout: auto;
    }
    th:first-child, td:first-child {
      width: auto;
      min-width: 45%;
      white-space: normal;
      word-break: normal;
    }
    td:first-child input {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      text-overflow: clip;
      overflow: visible;
    }


    @media screen and (max-width: 640px) {
      table { min-width: 0; }
      th, td { padding: 0.5rem 0.3rem; font-size: 0.75rem; }
      th:first-child, td:first-child { width: auto; min-width: 45%; }
      th:nth-child(2), td:nth-child(2) { width: 48px !important; }
      th:nth-child(3), td:nth-child(3) { width: 40px !important; }
      th:nth-child(4), td:nth-child(4) { width: 52px !important; }
      th:nth-child(5), td:nth-child(5) { width: 30px !important; }
      td input { font-size: 0.75rem; padding: 0.15rem; }
      td:first-child input { white-space: normal; text-align: start; }
    }


    th, td {
      border: 1px solid var(--border);
      padding: 0.75rem 0.5rem;
      text-align: center;
    }


    th {
      background-color: var(--navy);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }


    td input {
      width: 100%;
      text-align: center;
      border: 1px solid transparent;
      padding: 0.25rem;
      font-size: 0.9rem;
      background: transparent;
      color: var(--text);
    }


    td input:focus {
      border-color: var(--gold);
      outline: none;
      background-color: var(--input-bg);
    }


    .subject-name { text-align: start; font-weight: 500; }


    /* ========== SUMMARY ========== */
    .summary-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--navy);
      color: #ffffff;
      padding: 1rem 1.5rem;
      border-radius: 0.5rem;
      margin-top: 1.25rem;
      flex-wrap: wrap;
      gap: 1rem;
    }


    .summary-item {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }


    .summary-item span:first-child {
      font-size: 0.75rem;
      opacity: 0.85;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }


    .summary-item span:last-child {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold-light);
    }


    /* ========== APPRECIATION ========== */
    .auto-appreciation {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background-color: var(--table-stripe);
      border-left: 4px solid var(--gold);
      border-radius: 0.375rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
    }
    html[dir="rtl"] .auto-appreciation {
      border-left: none;
      border-right: 4px solid var(--gold);
    }


    /* ========== OBSERVATIONS ========== */
    .obs-section {
      margin-top: 1.25rem;
      display: flex;
      flex-direction: column;
    }


    .obs-section label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.25rem;
    }


    .obs-section textarea {
      width: 100%;
      height: 70px;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      resize: vertical;
      font-size: 0.9rem;
      background-color: var(--input-bg);
      color: var(--text);
    }


    .obs-section textarea:focus {
      border-color: var(--gold);
      outline: none;
      box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
    }


    /* ========== SIGNATURES ========== */
    .signatures-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-top: 2rem;
      text-align: center;
    }


    @media (max-width: 500px) {
      .signatures-grid { grid-template-columns: 1fr; }
    }


    .signature-box {
      border: 1px dashed var(--border);
      padding: 1rem;
      border-radius: 0.5rem;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: var(--table-stripe);
    }


    .signature-box span {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }


    /* ========== FOOTER ========== */
    .footer-signature {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }


    /* ========== RTL ========== */
    html[dir="rtl"] body {
      direction: rtl;
      text-align: right;
      max-width: 100%;
      overflow-x: hidden;
    }


    html[dir="rtl"] .toolbar,
    html[dir="rtl"] .report-card {
      max-width: 100%;
      overflow-x: hidden;
    }


    html[dir="rtl"] .header-content {
      width: 100%;
    }


    html[dir="rtl"] .logo-container {
      justify-content: flex-start;
      margin-left: 0;
    }


    html[dir="rtl"] table {
      width: 100%;
      border-collapse: collapse;
      margin: 0;
    }


    html[dir="rtl"] .summary-box {
      justify-content: space-between;
    }


    /* ========== CAPTURE PDF (classe temporaire) ========== */
    body.pdf-mode {
      overflow-x: visible !important;
      font-family: 'Poppins', 'Tajawal', sans-serif !important;
    }
    html[dir="rtl"] body.pdf-mode {
      direction: rtl !important;
      text-align: right !important;
    }
    html[dir="rtl"] body.pdf-mode .school-title { direction: rtl; text-align: center; }
    body.pdf-mode .table-wrapper {
      overflow: visible !important;
      border: none !important;
    }
    body.pdf-mode input,
    body.pdf-mode select,
    body.pdf-mode textarea {
      border: none !important;
      background: transparent !important;
      color: #000000 !important;
    }
    body.pdf-mode .logo-container {
      border: none !important;
      background: transparent !important;
    }
    body.pdf-mode .logo-text { display: none !important; }
    body.pdf-mode .report-card { box-shadow: none; border-top: none; }


    /* ========== PRINT ========== */
    @media print {
      body {
        background: #ffffff !important;
        padding: 0;
        color: #000000;
      }
      .toolbar, .btn-action, th:last-child, td:last-child,
      .theme-toggle, #logo-input {
        display: none !important;
      }
      .table-wrapper {
        overflow: visible !important;
        width: 100% !important;
        border: none !important;
      }
      table {
        width: 100% !important;
        min-width: 0 !important;
        border-collapse: collapse !important;
      }
      th, td {
        font-size: 11px !important;
        padding: 4px 6px !important;
        white-space: nowrap !important;
      }
      th:first-child, td:first-child {
        white-space: normal !important;
      }
      .logo-container {
        border: none !important;
        background: transparent !important;
      }
      .logo-text { display: none !important; }
      .report-card {
        box-shadow: none;
        border-top: none;
        padding: 0;
        width: 100%;
        max-width: 100%;
      }
      input, select, textarea {
        border: none !important;
        background: transparent !important;
        color: #000000 !important;
        appearance: none;
      }
      .signature-box { border: 1px solid #cbd5e1; }
      .summary-box { background-color: #1a2a3a !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      th { background-color: #1a2a3a !important; color: #ffffff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .auto-appreciation { background: #f8fafc !important; }
      .student-info { background: #f8fafc !important; border: 1px solid #e2e8f0 !important; }
    }
  </style>
</head>
<body>


  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="actions-main">
      <button onclick="addSubject()" class="btn-action" id="add-btn">+ Ajouter Matière</button>
      <button onclick="fillDemo()" class="btn-action" id="demo-btn">Remplir Démo</button>
      <button onclick="window.print()" class="btn-action" id="print-btn">Imprimer / PDF</button>
      <button onclick="TelechargerPDF()" class="btn-action" id="pdf-btn">Télécharger PDF</button>
      <button onclick="resetForm()" class="danger btn-action" id="reset-btn">Réinitialiser</button>
    </div>
    <div class="actions-utility">
      <button onclick="toggleLang()" class="secondary" id="lang-btn">العربية</button>
      <button onclick="toggleTheme()" class="theme-toggle" id="theme-btn" aria-label="Changer le thème">🌓</button>
    </div>
  </div>


  <!-- REPORT CARD -->
  <div class="report-card">
    
    <!-- HEADER -->
    <div class="header-content">
      <div class="logo-container" onclick="document.getElementById('logo-input').click()" onkeydown="if(event.key==='Enter'||event.key===' ') document.getElementById('logo-input').click()" tabindex="0" role="button" aria-label="Ajouter un logo">
        <div id="logo-placeholder">
          <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6l9-4.91V17h2V9L12 3z M5 13.18v4L12 21l7-3.82v-4L12 17L5 13.18z"/></svg>
          <div class="logo-text">+ Logo</div>
        </div>
        <img id="logo-img" style="display:none;" alt="Logo de l'école" />
        <input type="file" id="logo-input" accept="image/*" onchange="loadLogo(event)">
      </div>

      <input type="text" id="school-name" class="school-title" value="École Excellence" oninput="saveData()" maxlength="100">

      <div class="meta-info">
        <select id="period-select" onchange="saveData()">
          <option value="p1">Premier Semestre</option>
          <option value="p2">Deuxième Semestre</option>
          <option value="p3">Troisième Semestre</option>
        </select>
        <span class="divider">|</span>
        <input type="text" id="school-year" value="2026-2027" style="width: 6rem;" oninput="saveData()" maxlength="9">
      </div>
    </div>


    <!-- STUDENT INFO -->
    <div class="student-info">
      <div class="field">
        <label id="lbl-name">Nom & Prénom</label>
        <input type="text" id="student-name" placeholder="Ex: Yassine Mansouri" oninput="saveData()" maxlength="80">
      </div>
      <div class="field">
        <label id="lbl-class">Classe</label>
        <input type="text" id="student-class" placeholder="Ex: 3ème Année" oninput="saveData()" maxlength="50">
      </div>
      <div class="field">
        <label id="lbl-id">Matricule</label>
        <input type="text" id="student-id" placeholder="Ex: 2026-88" oninput="saveData()" maxlength="20">
      </div>
    </div>


    <!-- TABLE -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th id="th-subject">Matière</th>
            <th id="th-note" style="width: 70px;">Note (/20)</th>
            <th id="th-coef" style="width: 60px;">Coef</th>
            <th id="th-total" style="width: 70px;">Total</th>
            <th class="btn-action" id="th-action" style="width: 50px;">Action</th>
          </tr>
        </thead>
        <tbody id="subjects-body"></tbody>
      </table>
    </div>


    <!-- SUMMARY -->
    <div class="summary-box">
      <div class="summary-item">
        <span id="lbl-total-coef">Total Coefficients</span>
        <span id="res-coef">0</span>
      </div>
      <div class="summary-item">
        <span id="lbl-average">Moyenne Générale</span>
        <span id="res-average">-- / 20</span>
      </div>
      <div class="summary-item">
        <span id="lbl-mention">Mention</span>
        <span id="res-mention">--</span>
      </div>
    </div>


    <!-- APPRECIATION -->
    <div class="auto-appreciation" id="auto-appreciation-box">
      <span id="lbl-apprec-title">Appréciation globale :</span> <span id="res-appreciation">--</span>
    </div>


    <!-- OBSERVATIONS -->
    <div class="obs-section">
      <label id="lbl-obs">Observations du professeur principal</label>
      <textarea id="obs-text" placeholder="Remarques et conseils..." oninput="saveData()" maxlength="500"></textarea>
    </div>


    <!-- SIGNATURES -->
    <div class="signatures-grid">
      <div class="signature-box"><span id="lbl-sig-parents">Signature des parents</span></div>
      <div class="signature-box"><span id="lbl-sig-director">Cachet & Signature du Directeur</span></div>
    </div>


    <!-- FOOTER -->
    <div class="footer-signature" id="footer-text">Outil développé par UcfZem - Tanger</div>
  </div>


  <script>
    let currentLang = 'fr';
    let savedLogoBase64 = '';


    const translations = {
      fr: {
        langBtn: "العربية", addBtn: "+ Ajouter Matière", demoBtn: "Remplir Démo",
        resetBtn: "Réinitialiser", printBtn: "Imprimer / PDF", pdfBtn: "Télécharger PDF",
        lblName: "Nom & Prénom", lblClass: "Classe", lblId: "Matricule",
        thSubject: "Matière", thNote: "Note (/20)", thCoef: "Coef", thTotal: "Total", thAction: "Action",
        lblTotalCoef: "Total Coefficients", lblAverage: "Moyenne Générale", lblMention: "Mention",
        lblApprecTitle: "Appréciation globale :", lblObs: "Observations du professeur principal",
        lblSigParents: "Signature des parents", lblSigDirector: "Cachet & Signature du Directeur",
        footer: "Outil développé par UcfZem - Tanger",
        periods: { p1: "Premier Semestre", p2: "Deuxième Semestre", p3: "Troisième Semestre" }
      },
      ar: {
        langBtn: "Français", addBtn: "+ إضافة مادة", demoBtn: "ملء تجريبي",
        resetBtn: "إعادة ضبط", printBtn: "طباعة المستند", pdfBtn: "تحميل المستند",
        lblName: "الاسم والنسب", lblClass: "المستوى", lblId: "رقم التسجيل",
        thSubject: "المادة", thNote: "النقطة (20/)", thCoef: "المعامل", thTotal: "المجموع", thAction: "إجراء",
        lblTotalCoef: "مجموع المعاملات", lblAverage: "المعدل العام", lblMention: "الميزة",
        lblApprecTitle: "التقدير العام :", lblObs: "ملاحظات الأستاذ الرئيسي",
        lblSigParents: "توقيع ولي الأمر", lblSigDirector: "خاتم وتوقيع المدير",
        footer: "أداة مطورة من طرف UcfZem - طنجة",
        periods: { p1: "الدورة الأولى", p2: "الدورة الثانية", p3: "الدورة الثالثة" }
      }
    };


    function getSchoolYear() {
      const now = new Date();
      const y = now.getFullYear();
      return now.getMonth() >= 7 ? `${y}-${y + 1}` : `${y - 1}-${y}`;
    }


    function getDefaultSubjects() {
      return [
        { name_fr: "Mathématiques", name_ar: "الرياضيات", note: "", coef: 3 },
        { name_fr: "Physique", name_ar: "الفيزياء", note: "", coef: 2 },
        { name_fr: "SVT", name_ar: "علوم الحياة والأرض", note: "", coef: 2 },
        { name_fr: "Français", name_ar: "الفرنسية", note: "", coef: 3 },
        { name_fr: "Arabe", name_ar: "العربية", note: "", coef: 3 },
        { name_fr: "Anglais", name_ar: "الإنجليزية", note: "", coef: 2 }
      ];
    }


    let subjectsData = getDefaultSubjects();


    function init() {
      const savedTheme = localStorage.getItem('bulletin_theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }


      const currentYear = getSchoolYear();
      document.getElementById('school-year').value = currentYear;


      const saved = localStorage.getItem('bulletin_data');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          subjectsData = parsed.subjects || subjectsData;
          document.getElementById('student-name').value = parsed.name || '';
          document.getElementById('student-class').value = parsed.class || '';
          document.getElementById('student-id').value = parsed.id || '';
          document.getElementById('school-name').value = parsed.schoolName || 'École Excellence';
          document.getElementById('school-year').value = (parsed.schoolYear && parsed.schoolYear === currentYear) ? parsed.schoolYear : currentYear;
          document.getElementById('period-select').value = parsed.period || 'p1';
          document.getElementById('obs-text').value = parsed.obs || '';
          
          if (parsed.logo) {
            savedLogoBase64 = parsed.logo;
            displayLogo(savedLogoBase64);
          }
        } catch (e) {
          console.error("Erreur de lecture du localStorage", e);
        }
      }
      render();
    }


    function render() {
      const t = translations[currentLang];
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      
      document.getElementById('lang-btn').innerText = t.langBtn;
      document.getElementById('add-btn').innerText = t.addBtn;
      document.getElementById('demo-btn').innerText = t.demoBtn;
      document.getElementById('reset-btn').innerText = t.resetBtn;
      document.getElementById('print-btn').innerText = t.printBtn;
      document.getElementById('pdf-btn').innerText = t.pdfBtn;
      document.getElementById('lbl-name').innerText = t.lblName;
      document.getElementById('lbl-class').innerText = t.lblClass;
      document.getElementById('lbl-id').innerText = t.lblId;
      document.getElementById('th-subject').innerText = t.thSubject;
      document.getElementById('th-note').innerText = t.thNote;
      document.getElementById('th-coef').innerText = t.thCoef;
      document.getElementById('th-total').innerText = t.thTotal;
      document.getElementById('th-action').innerText = t.thAction;
      document.getElementById('lbl-total-coef').innerText = t.lblTotalCoef;
      document.getElementById('lbl-average').innerText = t.lblAverage;
      document.getElementById('lbl-mention').innerText = t.lblMention;
      document.getElementById('lbl-apprec-title').innerText = t.lblApprecTitle;
      document.getElementById('lbl-obs').innerText = t.lblObs;
      document.getElementById('lbl-sig-parents').innerText = t.lblSigParents;
      document.getElementById('lbl-sig-director').innerText = t.lblSigDirector;
      document.getElementById('footer-text').innerText = t.footer;


      const select = document.getElementById('period-select');
      const selectedVal = select.value;
      select.innerHTML = `
        <option value="p1">${t.periods.p1}</option>
        <option value="p2">${t.periods.p2}</option>
        <option value="p3">${t.periods.p3}</option>
      `;
      select.value = selectedVal;


      const tbody = document.getElementById('subjects-body');
      tbody.innerHTML = '';


      subjectsData.forEach((item, idx) => {
        const name = currentLang === 'ar' ? (item.name_ar || item.name_fr) : (item.name_fr || item.name_ar);
        const total = (item.note !== "" && !isNaN(item.note)) ? (parseFloat(item.note) * parseFloat(item.coef)).toFixed(2) : "-";


        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="text" class="subject-name" value="${name}" oninput="updateSubjectName(${idx}, this.value)" maxlength="60"></td>
          <td><input type="number" min="0" max="20" step="0.25" value="${item.note}" oninput="updateNote(${idx}, this.value)"></td>
          <td><input type="number" min="1" max="10" value="${item.coef}" oninput="updateCoef(${idx}, this.value)"></td>
          <td>${total}</td>
          <td class="btn-action"><button class="danger" style="padding:0.25rem 0.5rem; font-size:0.8rem;" onclick="removeSubject(${idx})" aria-label="Supprimer">×</button></td>
        `;
        tbody.appendChild(tr);
      });


      calculate();
    }


    function updateSubjectName(idx, val) {
      if (currentLang === 'ar') {
        subjectsData[idx].name_ar = val;
        if (!subjectsData[idx].name_fr) subjectsData[idx].name_fr = val;
      } else {
        subjectsData[idx].name_fr = val;
        if (!subjectsData[idx].name_ar) subjectsData[idx].name_ar = val;
      }
      saveData();
    }


    function updateNote(idx, val) { subjectsData[idx].note = val; renderCalculationsOnly(); saveData(); }
    function updateCoef(idx, val) { subjectsData[idx].coef = val; renderCalculationsOnly(); saveData(); }


    function addSubject() {
      subjectsData.push({ name_fr: "Nouvelle Matière", name_ar: "مادة جديدة", note: "", coef: 1 });
      render(); saveData();
    }


    function removeSubject(idx) { subjectsData.splice(idx, 1); render(); saveData(); }


    function calculate() {
      let totalPoints = 0, totalCoef = 0, valid = false;
      subjectsData.forEach(item => {
        const n = parseFloat(item.note), c = parseFloat(item.coef);
        if (!isNaN(n) && !isNaN(c) && item.note !== "") { totalPoints += n * c; totalCoef += c; valid = true; }
      });


      document.getElementById('res-coef').innerText = totalCoef;


      if (valid && totalCoef > 0) {
        const avg = (totalPoints / totalCoef).toFixed(2);
        document.getElementById('res-average').innerText = `${avg} / 20`;
        document.getElementById('res-mention').innerText = getMention(avg);
        document.getElementById('res-appreciation').innerText = getAppreciation(avg);
      } else {
        document.getElementById('res-average').innerText = "-- / 20";
        document.getElementById('res-mention').innerText = "--";
        document.getElementById('res-appreciation').innerText = "--";
      }
    }


    function renderCalculationsOnly() {
      const rows = document.querySelectorAll('#subjects-body tr');
      subjectsData.forEach((item, idx) => {
        if (rows[idx]) {
          const totalCell = rows[idx].children[3];
          const total = (item.note !== "" && !isNaN(item.note)) ? (parseFloat(item.note) * parseFloat(item.coef)).toFixed(2) : "-";
          totalCell.innerText = total;
        }
      });
      calculate();
    }


    function getMention(avg) {
      if (avg >= 16) return currentLang === 'ar' ? 'ممتاز' : 'Très Bien';
      if (avg >= 14) return currentLang === 'ar' ? 'جيد جداً' : 'Bien';
      if (avg >= 12) return currentLang === 'ar' ? 'جيد' : 'Assez Bien';
      if (avg >= 10) return currentLang === 'ar' ? 'مقبول' : 'Passable';
      return currentLang === 'ar' ? 'دون المتوسط' : 'Insuffisant';
    }


    function getAppreciation(avg) {
      if (avg >= 16) return currentLang === 'ar' ? 'عمل ممتاز، تهانينا!' : 'Excellents résultats, félicitations !';
      if (avg >= 14) return currentLang === 'ar' ? 'عمل جيد جداً، واصل الإجتهاد.' : 'Très bon travail, continuez ainsi.';
      if (avg >= 12) return currentLang === 'ar' ? 'عمل جيد، يمكنك تحقيق الأفضل.' : 'Bon travail dans l\'ensemble, peut mieux faire.';
      if (avg >= 10) return currentLang === 'ar' ? 'نتائج مقبولة، يجب بذل المزيد من الجهد.' : 'Résultats passables, des efforts sont requis.';
      return currentLang === 'ar' ? 'نتائج غير كافية، يجب العمل بجدية أكبر.' : 'Résultats insuffisants, un redressement s\'impose.';
    }


    function toggleLang() { currentLang = currentLang === 'fr' ? 'ar' : 'fr'; render(); }


    function TelechargerPDF() {
      const btn = document.getElementById('pdf-btn');
      if (btn.disabled) return;
      btn.disabled = true;
      btn.style.opacity = '0.6';
      const root = document.documentElement;
      const card = document.querySelector('.report-card');
      const prevTheme = root.getAttribute('data-theme') || 'light';
      const prevWidth = card.style.width;
      const prevMaxWidth = card.style.maxWidth;
      const wrapper = card.querySelector('.table-wrapper');
      const prevWOverflow = wrapper ? wrapper.style.overflow : '';
      const prevWBorder = wrapper ? wrapper.style.border : '';
      root.setAttribute('data-theme', 'light');
      document.body.classList.add('pdf-mode');
      card.style.width = '210mm';
      card.style.maxWidth = '210mm';
      if (wrapper) {
        wrapper.style.overflow = 'visible';
        wrapper.style.border = 'none';
      }
      const captureWidth = Math.ceil(card.getBoundingClientRect().width);
      const opt = {
        margin: [8, 8, 8, 8],
        filename: 'Bulletin_Scolaire.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', windowWidth: captureWidth, scrollX: 0, scrollY: 0 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['css', 'legacy'] }
      };
      html2pdf().set(opt).from(card).save().then(() => {
        document.body.classList.remove('pdf-mode');
        root.setAttribute('data-theme', prevTheme);
        card.style.width = prevWidth;
        card.style.maxWidth = prevMaxWidth;
        if (wrapper) {
          wrapper.style.overflow = prevWOverflow;
          wrapper.style.border = prevWBorder;
        }
        btn.disabled = false;
        btn.style.opacity = '';
      });
    }


    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('bulletin_theme', next);
    }


    function fillDemo() {
      const isAr = currentLang === 'ar';
      document.getElementById('school-name').value = isAr ? "مدرسة عبد الكريم" : "École Abdelkrim";
      document.getElementById('student-name').value = isAr ? "ياسين المنصوري" : "Yassine Mansouri";
      document.getElementById('student-class').value = isAr ? "السنة الثالثة إعدادي" : "3ème Année Collège";
      document.getElementById('student-id').value = "2026-442";
      document.getElementById('obs-text').value = isAr ? 'تلميذ مجد ومواظب، يتمنى له الطاقم التربوي المزيد من التوفيق.' : 'Élève très sérieux et assidu. Bon comportement général.';


      subjectsData = [
        { name_fr: "Mathématiques", name_ar: "الرياضيات", note: "16.5", coef: 3 },
        { name_fr: "Physique", name_ar: "الفيزياء", note: "14.0", coef: 2 },
        { name_fr: "SVT", name_ar: "علوم الحياة والأرض", note: "15.0", coef: 2 },
        { name_fr: "Français", name_ar: "الفرنسية", note: "13.5", coef: 3 },
        { name_fr: "Arabe", name_ar: "العربية", note: "17.0", coef: 3 },
        { name_fr: "Anglais", name_ar: "الإنجليزية", note: "15.5", coef: 2 }
      ];
      render(); saveData();
    }


    function resetForm() {
      document.getElementById('student-name').value = "";
      document.getElementById('student-class').value = "";
      document.getElementById('student-id').value = "";
      document.getElementById('obs-text').value = "";
      savedLogoBase64 = '';
      document.getElementById('logo-img').style.display = 'none';
      document.getElementById('logo-img').src = '';
      document.getElementById('logo-placeholder').style.display = 'flex';
      subjectsData = getDefaultSubjects();
      localStorage.removeItem('bulletin_data');
      render();
    }


    function displayLogo(src) {
      const img = document.getElementById('logo-img');
      img.src = src;
      img.style.display = 'block';
      document.getElementById('logo-placeholder').style.display = 'none';
    }


    function loadLogo(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          savedLogoBase64 = evt.target.result;
          displayLogo(savedLogoBase64);
          saveData();
        }
        reader.readAsDataURL(file);
      }
    }


    function saveData() {
      const data = {
        name: document.getElementById('student-name').value,
        class: document.getElementById('student-class').value,
        id: document.getElementById('student-id').value,
        schoolName: document.getElementById('school-name').value,
        schoolYear: document.getElementById('school-year').value,
        period: document.getElementById('period-select').value,
        obs: document.getElementById('obs-text').value,
        logo: savedLogoBase64,
        subjects: subjectsData
      };
      localStorage.setItem('bulletin_data', JSON.stringify(data));
    }


    init();
  </script>
</body>
</html>
